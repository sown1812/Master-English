services:
  - type: web
    name: masterenglish-server
    env: docker
    rootDir: .
    dockerfilePath: server/Dockerfile
    autoDeploy: true
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
